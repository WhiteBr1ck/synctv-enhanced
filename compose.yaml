name: synctv-enhanced
services:
  synctv:
    image: ${SYNCTV_IMAGE_PREFIX:-ghcr.io/whitebr1ck/synctv-enhanced}:${SYNCTV_TAG:-0.9.15-enhanced.11}
    restart: unless-stopped
    ports:
      - "${SYNCTV_PORT:-8080}:8080/udp"
    volumes:
      - ./data:/root/.synctv
    environment:
      PUID: ${PUID:-0}
      PGID: ${PGID:-0}
      UMASK: ${UMASK:-022}
      TZ: ${TZ:-Asia/Shanghai}
  subtitles:
    image: ${SYNCTV_IMAGE_PREFIX:-ghcr.io/whitebr1ck/synctv-enhanced}-subtitles:${SYNCTV_TAG:-0.9.15-enhanced.11}
    restart: unless-stopped
    depends_on:
      - synctv
    ports:
      - "${SYNCTV_PORT:-8080}:8080/tcp"
    volumes:
      - ./data/subtitle-cache:/cache
    environment:
      SYNCTV_UPSTREAM: http://synctv:8080
      TZ: ${TZ:-Asia/Shanghai}
    cpus: 2.0
    mem_limit: 768m
