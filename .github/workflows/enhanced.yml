name: Enhanced checks and Docker images
on:
  push:
    branches: [enhanced-v0.9.15]
    tags: ['v0.9.15-enhanced.*']
  pull_request:
    branches: [enhanced-v0.9.15]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enhanced-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: synctv-web/package-lock.json
      - name: Install FFmpeg for real media fixtures
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install frontend dependencies
        working-directory: synctv-web
        run: npm ci --no-audit --no-fund
      - name: Type check and build frontend
        working-directory: synctv-web
        run: npm run build
      - name: Test subtitles, transport, sorting, chat and video statistics
        run: node --test subtitle-gateway/*.test.mjs
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Test chat persistence and directory request limits
        run: |
          go test ./internal/db ./utils ./internal/cache ./server/handlers/vendors/vendoremby ./server/handlers/vendors/vendoralist
          (cd vendors && go test ./service/emby ./service/alist ./utils)
  images:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [core, gateway]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
      - name: Choose image name
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$TARGET" = gateway ]; then image="$image-subtitles"; fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/enhanced-v0.9.15' }}
            type=sha,prefix=git-
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        name: Build native image for startup verification
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: local/synctv-check:${{ matrix.target }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.15-enhanced-dev' }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
      - name: Verify container entrypoint and HTTP startup
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run -d --name enhanced-startup-check -p 127.0.0.1:18080:8080 "local/synctv-check:$TARGET"
          trap 'docker rm -fv enhanced-startup-check >/dev/null 2>&1 || true' EXIT
          path=/web/
          if [ "$TARGET" = gateway ]; then path=/_synctv/health; fi
          for attempt in $(seq 1 90); do
            if curl --fail --silent "http://127.0.0.1:18080$path" >/dev/null; then exit 0; fi
            if [ "$(docker inspect --format '{{.State.Running}}' enhanced-startup-check)" != true ]; then
              docker logs enhanced-startup-check
              exit 1
            fi
            echo "Waiting for $TARGET startup ($attempt/90)"
            sleep 1
          done
          docker logs enhanced-startup-check
          exit 1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        name: Build and publish platform images
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.15-enhanced-dev' }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
